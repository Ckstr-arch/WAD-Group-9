<body data-require="any">
  <div class="app-shell">

      <a href="student-dashboard.html" class="brand" aria-label="NSBM SportsHub" style="text-decoration:none;">
        <svg class="brand-mark" viewBox="34 14 407 444" width="32" height="32" aria-hidden="true" focusable="false">

            <linearGradient id="brand-blue" x1="40" y1="130" x2="360" y2="360" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2463a1"/>

            <linearGradient id="brand-blue-top" x1="240" y1="20" x2="414" y2="133" gradientUnits="userSpaceOnUse">
              <stop stop-color="#205e9b"/>
              <stop offset="1" stop-color="#245e96"/>
            </linearGradient>
            <linearGradient id="brand-green" x1="239" y1="180" x2="435" y2="280" gradientUnits="userSpaceOnUse">
              <stop stop-color="#39b143"/>
              <stop offset="1" stop-color="#32a942"/>
            </linearGradient>
            <linearGradient id="brand-lime" x1="40" y1="200" x2="286" y2="380" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8fc640"/>
              <stop offset="1" stop-color="#88c440"/>

          <path fill="url(#brand-blue-top)" d="M240 18C294 20 351 30 396 50C405 77 411 106 414 133L239 145Z"/>
          <path fill="url(#brand-blue)" d="M40 130C111 133 161 101 201 105C217 118 231 134 239 145L239 345C228 335 217 329 205 332C172 267 111 219 41 189Z"/>

          <path fill="url(#brand-blue)" d="M286 331L379 355C350 396 295 429 236 454C259 418 277 376 286 331Z"/>
          <path fill="url(#brand-lime)" d="M205 332C217 329 229 335 239 345C253 333 269 329 286 332C278 380 257 428 236 454C231 410 221 367 205 332Z"/>
          <path fill="url(#brand-green)" d="M239 116C278 86 309 125 414 132L435 133L435 363C375 367 327 340 286 333C268 329 251 332 239 345Z"/>
          <path fill="url(#brand-lime)" d="M40 214C125 251 205 321 207 444C107 421 50 302 40 214Z"/>
        </svg>
        <span>NSBM<span class="brand-sub">SPORTSHUB</span></span>
      </a>
      <nav class="nav-list">
        <a href="student-dashboard.html">Student Portal</a>
        <a href="book-facilities.html">Book Facilities</a>
        <a href="clubs.html">Clubs</a>
        <a href="training-schedule.html" class="active" aria-current="page">Training Schedule</a>
        <a href="tournaments.html">Tournaments & Results</a>
        <a href="index.html" id="logout-btn">Sign out</a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <span class="eyebrow">WEEKLY SESSIONS</span>
          <h1>Training Schedule</h1>
          <p class="muted">Upcoming training sessions for all NSBM sports clubs.</p>
        </div>
      </header>

      <div class="content container">
        <section class="timetable card">
          <h2>Practice Sessions Schedule of Sports Clubs - 2026</h2>
          <a href="assets/pictures/Time Table.png" target="_blank" rel="noopener noreferrer">
            <img class="timetable-img" src="assets/pictures/Time Table.png" alt="Practice sessions schedule of sports clubs 2026">
          </a>
        </section>

        <div class="filter-bar" style="margin-top: 20px;">
          <button type="button" class="chip active" data-filter="all">All Days</button>
          <button type="button" class="chip" data-filter="monday">Monday</button>
          <button type="button" class="chip" data-filter="tuesday">Tuesday</button>
          <button type="button" class="chip" data-filter="wednesday">Wednesday</button>
          <button type="button" class="chip" data-filter="thursday">Thursday</button>
          <button type="button" class="chip" data-filter="friday">Friday</button>
        </div>
        <div class="schedule-list" id="scheduleList"></div>
      </div>
    </main>
  </div>

  <script type="module" src="services/guard.js"></script>
  <script src="book-facilities & training-schedule.js"></script>

</html>
