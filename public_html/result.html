<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results · NSBM SportsHub</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="result.css">
</head>
<body data-require="any">
  <div class="app-shell">
    <aside class="sidebar">
      <a href="student-dashboard.html" class="brand" aria-label="NSBM SportsHub" style="text-decoration:none;">
        <svg class="brand-mark" viewBox="34 14 407 444" width="32" height="32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="brand-blue" x1="40" y1="130" x2="360" y2="360" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2463a1"/>
              <stop offset="1" stop-color="#18558e"/>
            </linearGradient>
            <linearGradient id="brand-blue-top" x1="240" y1="20" x2="414" y2="133" gradientUnits="userSpaceOnUse">
              <stop stop-color="#205e9b"/>
              <stop offset="1" stop-color="#245e96"/>
            </linearGradient>
            <linearGradient id="brand-green" x1="239" y1="180" x2="435" y2="280" gradientUnits="userSpaceOnUse">
              <stop stop-color="#39b143"/>
              <stop offset="1" stop-color="#32a942"/>
            </linearGradient>
            <linearGradient id="brand-lime" x1="40" y1="200" x2="286" y2="380" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8fc640"/>
              <stop offset="1" stop-color="#88c440"/>
            </linearGradient>
          </defs>
          <path fill="url(#brand-blue-top)" d="M240 18C294 20 351 30 396 50C405 77 411 106 414 133L239 145Z"/>
          <path fill="url(#brand-blue)" d="M40 130C111 133 161 101 201 105C217 118 231 134 239 145L239 345C228 335 217 329 205 332C172 267 111 219 41 189Z"/>
          <path fill="url(#brand-lime)" d="M40 46C103 51 165 74 201 105C161 102 143 131 40 131Z"/>
          <path fill="url(#brand-blue)" d="M286 331L379 355C350 396 295 429 236 454C259 418 277 376 286 331Z"/>
          <path fill="url(#brand-lime)" d="M205 332C217 329 229 335 239 345C253 333 269 329 286 332C278 380 257 428 236 454C231 410 221 367 205 332Z"/>
          <path fill="url(#brand-green)" d="M239 116C278 86 309 125 414 132L435 133L435 363C375 367 327 340 286 333C268 329 251 332 239 345Z"/>
          <path fill="url(#brand-lime)" d="M40 214C125 251 205 321 207 444C107 421 50 302 40 214Z"/>
        </svg>
        <span>NSBM<span class="brand-sub">SPORTSHUB</span></span>
      </a>
      <nav class="nav-list">
        <a href="student-dashboard.html">Student Portal</a>
        <a href="book-facilities.html">Book Facilities</a>
        <a href="clubs.html">Clubs</a>
        <a href="training-schedule.html">Training Schedule</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="result.html" class="active" aria-current="page">Results</a>
        <a href="index.html" id="logout-btn">Sign out</a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <span class="eyebrow">SCORES</span>
          <h1>Match Results</h1>
          <p class="muted">Latest results and tournament standings.</p>
        </div>
      </header>

      <div class="content">
        <div class="toolbar">
          <select id="tournament-filter" aria-label="Filter by tournament">
            <option value="">All tournaments</option>
          </select>
          <select id="sport-filter" aria-label="Filter by sport">
            <option value="">All sports</option>
          </select>
        </div>

        <section id="admin-panel" class="card admin-panel" hidden>
          <h2>Record a result</h2>
          <form id="result-form" class="result-form">
            <select id="f-tournament" required aria-label="Tournament"></select>
            <input id="f-round" maxlength="60" placeholder="Round (e.g. Group A, Final)" aria-label="Round">
            <input id="f-team-a" maxlength="120" placeholder="Team A" required aria-label="Team A">
            <input id="f-score-a" type="number" min="0" step="1" placeholder="Score A" required aria-label="Score A">
            <input id="f-team-b" maxlength="120" placeholder="Team B" required aria-label="Team B">
            <input id="f-score-b" type="number" min="0" step="1" placeholder="Score B" required aria-label="Score B">
            <input id="f-date" type="date" required aria-label="Match date">
            <button type="submit" class="btn btn-primary">Save result</button>
          </form>
        </section>

        <div id="state" class="state-box" hidden></div>

        <div class="results-layout">
          <section class="card">
            <h2>Results</h2>
            <div id="results-list" class="results-list"></div>
          </section>

          <section class="card">
            <h2>Standings</h2>
            <p id="standings-hint" class="muted"></p>
            <div class="table-wrap">
              <table class="standings" id="standings-table" hidden>
                <thead>
                  <tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
                </thead>
                <tbody id="standings-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="mock-api.js"></script>
  <script src="result.js"></script>
</body>
</html>
