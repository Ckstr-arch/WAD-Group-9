<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Facilities - NSBM SportsHub</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<nav class="navbar">
  <div class="logo">NSBM <span>SportsHub</span></div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="clubs.html">Clubs</a></li>
    <li><a href="training-schedule.html">Schedule</a></li>
    <li><a href="fixtures.html">Fixtures</a></li>
    <li><a href="tournaments.html">Tournaments</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="book-facilities.html" class="active">Facilities</a></li>
  </ul>
  <div class="nav-right">Student ▾</div>
</nav>

<header class="page-header">
  <h1>Book a Facility</h1>
  <p>Reserve sports facilities and equipment for your training or events.</p>
</header>

<main class="container">
  <div class="facilities-grid" id="facilitiesGrid"></div>

  <section class="booking-section" id="bookingSection">
    <h2>Request a Booking</h2>
    <form id="bookingForm">
      <div class="form-row">
        <label>Facility</label>
        <select id="facilitySelect" required></select>
      </div>
      <div class="form-row two-col">
        <div><label>Date</label><input type="date" id="bookingDate" required></div>
        <div><label>Start Time</label><input type="time" id="startTime" required></div>
        <div><label>End Time</label><input type="time" id="endTime" required></div>
      </div>
      <button type="submit" class="btn-green">Request Booking</button>
    </form>
  </section>

  <section class="my-bookings">
    <h2>My Booking Requests</h2>
    <table>
      <thead><tr><th>Facility</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
      <tbody id="bookingsBody"></tbody>
    </table>
    <p id="noBookings" class="muted">No booking requests yet.</p>
  </section>
</main>

<script src="JS/schedule.js"></script>
</body>
</html>
